<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Particle Trainer</h1>
      <nav class="tabs">
        <button class="tab" data-mode="particles">Particles</button>
        <button class="tab" data-mode="translate">Translate</button>
        <button class="tab" data-mode="type">Type</button>
      </nav>
      <div class="stats">
        <span id="streak"></span>
        <span id="score">0 / 0</span>
      </div>
    </header>

    <section class="card">
      <p id="english" class="english"></p>
      <p id="sentence" class="sentence" lang="ja"></p>
      <div id="choices" class="choices" lang="ja"></div>
      <button id="action" class="action">Check</button>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <p id="help" class="help"></p>
  </main>

  <script src="sentences.js"></script>
  <script src="romaji.js"></script>
  <script src="app.js"></script>
</body>
</html>
