<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Particle Trainer</h1>
      <nav class="tabs">
        <button class="tab" data-mode="particles">Particles</button>
        <button class="tab" data-mode="translate">Translate</button>
        <button class="tab" data-mode="type">Type</button>
      </nav>
      <div class="stats">
        <span id="streak"></span>
        <span id="score">0 / 0</span>
        <button id="settings-button" class="icon" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </header>

    <section class="card">
      <p id="english" class="english"></p>
      <p id="sentence" class="sentence" lang="ja"></p>
      <div id="choices" class="choices" lang="ja"></div>
      <button id="action" class="action">Check</button>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <p id="help" class="help"></p>
  </main>

  <dialog id="settings">
    <form>
      <h2>Sentence settings</h2>
      <p class="note">Saving gives you a new sentence, unless you have already answered the current one.</p>

      <fieldset>
        <legend>Genki lessons</legend>
        <label><input type="checkbox" name="lessons" value="1"> 1</label>
        <label><input type="checkbox" name="lessons" value="2"> 2</label>
        <label><input type="checkbox" name="lessons" value="3"> 3</label>
      </fieldset>

      <fieldset lang="ja">
        <legend lang="en">Particles</legend>
        <label><input type="checkbox" name="particles" value="は"> は</label>
        <label><input type="checkbox" name="particles" value="の"> の</label>
        <label><input type="checkbox" name="particles" value="も"> も</label>
        <label><input type="checkbox" name="particles" value="を"> を</label>
        <label><input type="checkbox" name="particles" value="で"> で</label>
        <label><input type="checkbox" name="particles" value="に"> に</label>
        <label><input type="checkbox" name="particles" value="へ"> へ</label>
      </fieldset>

      <fieldset>
        <legend>Sentence types</legend>
        <label><input type="checkbox" name="types" value="positive"> Positive</label>
        <label><input type="checkbox" name="types" value="negative"> Negative <span lang="ja">(ません)</span></label>
        <label><input type="checkbox" name="types" value="question"> Question <span lang="ja">(か)</span></label>
      </fieldset>

      <fieldset>
        <legend>Particles per sentence</legend>
        <label><input type="radio" name="length" value="any"> Any</label>
        <label><input type="radio" name="length" value="short"> 1–2</label>
        <label><input type="radio" name="length" value="medium"> 2–3</label>
        <label><input type="radio" name="length" value="long"> 3 or more</label>
      </fieldset>

      <p id="settings-error" class="error" aria-live="polite"></p>
      <div class="dialog-buttons">
        <button type="button" id="settings-defaults">Defaults</button>
        <span></span>
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="vocab.js"></script>
  <script src="generate.js"></script>
  <script src="romaji.js"></script>
  <script src="app.js"></script>
</body>
</html>
